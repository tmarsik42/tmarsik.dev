name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Runs dependency code, so it gets no secrets
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/
          retention-days: 1

  # Gets the key, but runs nothing except rsync
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tmarsik.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # The key can only upload into the web root (rrsync on the server)
      - name: Upload
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/known_hosts
          rsync -rlt --delete --chmod=D755,F644 \
            -e "ssh -i ~/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/known_hosts" \
            site/ "deploy@$DEPLOY_HOST:"
